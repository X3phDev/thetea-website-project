        <h1>Contact Us</h1>
 <p> Please enter your contact information below and we will be in contact with you between 24-48 business hours: </p>

<section class="contact-us">
<form action="mailto:contactthetea@gmail.com" method="post" enctype="text/plain">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your name">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email">
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Subject">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Type your message here"></textarea>
        <button type="submit">Send Message</button>
</form>
